<style>@font-face{font-family:'SY-display';src:url(data:font/woff;base64,) format('woff');}@font-face{font-family:'SY-hand';src:url(data:font/woff;base64,) format('woff');}.d{font-family:'SY-display',Impact, 'Arial Narrow', sans-serif;}.h{font-family:'SY-hand','Comic Sans MS', cursive;}.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
