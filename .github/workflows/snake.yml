name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#d6301f&color_dots=#ece7dd,#cfc6b4,#9a9284,#5a564f,#121212
            dist/snake-dark.svg?color_snake=#d6301f&color_dots=#161b22,#3a3631,#6f695f,#b5ad9c,#f2ede3

      # dist/ is created by the snk container as root, so publish from a copy
      - name: Publish to the output branch
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp dist/*.svg "$RUNNER_TEMP/out/"
          cd "$RUNNER_TEMP/out"
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Update contribution snake"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
